name: LoL Encyclopedia Lakehouse CI Pipeline

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install UV & Enable Caching for faster builds
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true
                cache-dependency-glob: "uv.lock"

            - name: Install/Sync dependencies
              run: uv sync --locked --all-extras

            - name: Run linter
              run: uv run ruff check

            - name: Run tests
              run: uv run pytest
