[project]
name = "lol-encyclopedia-lakehouse"
version = "0.1.0"
description = "Web app that provides information on League of Legends champions"
readme = "README.md"
authors = [
    { name = "Nuno Costa", email = "nunocosta.1712@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lol-encyclopedia-lakehouse = "lol_encyclopedia_lakehouse:main"

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"}
]
test = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
]
lint = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "F",  # pyflakes rules
    "E",  # pycodestyle error rules
    "I",  # isort rules
    "UP", # pyupgrade rules
    "B",  # flake8-bugbear
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
